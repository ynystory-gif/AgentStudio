name: Validate v5.495 Resilient Agent Coding Style

on:
  push:
    branches: [fix/v5.495-resilient-agent-coding-style]
    paths:
      - .github/workflows/validate-v5-495-resilient-agent-coding-style.yml

permissions:
  contents: write

jobs:
  validate-build-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply checksummed v5.495 source patch
        shell: bash
        run: |
          cat .github/scripts/v5495_patch.part* > /tmp/v5495_source.patch.gz.b64
          python - <<'PY'
          import base64, gzip, hashlib
          from pathlib import Path
          encoded = Path('/tmp/v5495_source.patch.gz.b64').read_text(encoding='utf-8').strip()
          expected_encoded = 'a20ea80e90066546491d760b2ce31e7b94bb322b2414dc1f69b60f073230aa0a'
          actual_encoded = hashlib.sha256(encoded.encode('utf-8')).hexdigest()
          if actual_encoded != expected_encoded:
              raise AssertionError(f'encoded patch checksum mismatch: {actual_encoded}')
          raw = gzip.decompress(base64.b64decode(encoded))
          expected_raw = 'c3a5cc019dc1f2ed98c1691131e24f931a8384ba30309cbae982c1b8dfeeed42'
          actual_raw = hashlib.sha256(raw).hexdigest()
          if actual_raw != expected_raw:
              raise AssertionError(f'raw patch checksum mismatch: {actual_raw}')
          Path('/tmp/v5495_source.patch').write_bytes(raw)
          print('v5.495 patch checksum PASS')
          PY
          git apply --check /tmp/v5495_source.patch
          git apply /tmp/v5495_source.patch

      - name: Validate backend and coding style contract
        shell: bash
        run: |
          python -m compileall -q backend/app
          python backend/validate_v5495_resilient_agent_coding_style_contract.py
          PYTHONPATH=backend python - <<'PY'
          from app.services.coding_rule_selector import coding_rules_for_request
          result = coding_rules_for_request(
              'PDF OCR Agent를 만들고 EasyOCR/PaddleOCR GPU CPU 성능 비교와 모델 다운로드 fallback을 구현해줘',
              path='notebooks/ocr.ipynb',
              project_scope=True,
          )
          selected = {row.get('id') for row in result.get('rules') or []}
          required = {f'CS-{number}' for number in range(163, 170)}
          missing = sorted(required - selected)
          if missing:
              raise AssertionError(f'v5.495 selector missing: {missing}')
          print('v5.495 selector PASS', sorted(required))
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend clean production build
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Commit tested v5.495 source
        shell: bash
        run: |
          git config user.name "ynystory-gif"
          git config user.email "ynystory@gmail.com"
          git add README.md README_V5_495_ResilientAgentCodingStyle.md frontend/src/App.jsx backend/app/main.py backend/app/api/routes.py backend/app/services/agent_workflow.py backend/app/services/coding_rule_selector.py backend/validate_v5495_resilient_agent_coding_style_contract.py
          git add -f backend/app/data/coding_style/rules.json backend/app/data/coding_style/sources/document_loading_ocr_notebook.md
          git commit -m "feat: add resilient Agent coding style for v5.495"
          git push origin HEAD:fix/v5.495-resilient-agent-coding-style

      - name: Build clean distribution tree
        shell: bash
        run: |
          rm -rf package
          mkdir package
          rsync -a ./ package/ \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'package' \
            --exclude 'frontend/node_modules' \
            --exclude 'frontend/dist' \
            --exclude 'README_V5_*.md'
          cp README_V5_495_ResilientAgentCodingStyle.md package/
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('package')
          assert (root/'README.md').exists()
          assert [p.name for p in root.glob('README_V5_*.md')] == ['README_V5_495_ResilientAgentCodingStyle.md']
          assert "AGENTSTUDIO_FRONTEND_VERSION='5.495'" in (root/'frontend/src/App.jsx').read_text(encoding='utf-8')
          assert 'version="5.495"' in (root/'backend/app/main.py').read_text(encoding='utf-8')
          assert '"version": "5.495"' in (root/'backend/app/api/routes.py').read_text(encoding='utf-8')
          registry = json.loads((root/'backend/app/data/coding_style/rules.json').read_text(encoding='utf-8'))
          assert registry['version'] == '2.0'
          assert all(any(r.get('id') == f'CS-{n}' for r in registry['rules']) for n in range(163, 170))
          assert (root/'backend/app/data/coding_style/sources/document_loading_ocr_notebook.md').exists()
          print('v5.495 distribution contract PASS')
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: THEANOVA_AgentStudio_v5_495_ResilientAgentCodingStyle
          path: package
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
