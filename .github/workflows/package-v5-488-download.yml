name: Package v5.488 Download

on:
  push:
    paths:
      - '.github/workflows/package-v5-488-download.yml'

permissions:
  contents: read

env:
  SOURCE_REF: 169dbde57a762e8328120da62fd052c50ebeaa24
  PACKAGE_NAME: THEANOVA_AgentStudio_v5_488_NotebookStreamingRecovery

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact v5.488 source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_REF }}

      - name: Build clean distribution tree
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "release/${PACKAGE_NAME}"
          rsync -a ./ "release/${PACKAGE_NAME}/" \
            --exclude '.git/' \
            --exclude 'release/'

          find "release/${PACKAGE_NAME}" -maxdepth 1 -type f -name 'README_V5_*.md' \
            ! -name 'README_V5_488_NotebookStreamingRecovery.md' -delete

          test -f "release/${PACKAGE_NAME}/README.md"
          test -f "release/${PACKAGE_NAME}/README_V5_488_NotebookStreamingRecovery.md"
          grep -q "AGENTSTUDIO_FRONTEND_VERSION='5.488'" "release/${PACKAGE_NAME}/frontend/src/App.jsx"
          grep -q 'version="5.488"' "release/${PACKAGE_NAME}/backend/app/main.py"
          grep -q '"version": "5.488"' "release/${PACKAGE_NAME}/backend/app/api/routes.py"
          grep -q 'packageManagementMode' "release/${PACKAGE_NAME}/frontend/src/App.jsx"
          grep -q 'NotebookStreamingRecovered' "release/${PACKAGE_NAME}/frontend/src/App.jsx"
          grep -q 'PythonWorkerExited' "release/${PACKAGE_NAME}/backend/app/services/python_execution_service.py"

      - name: Upload v5.488 full source artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PACKAGE_NAME }}
          path: release/${{ env.PACKAGE_NAME }}/
          include-hidden-files: true
          if-no-files-found: error
          compression-level: 6
          retention-days: 7
