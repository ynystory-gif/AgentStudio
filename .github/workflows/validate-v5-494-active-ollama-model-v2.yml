name: Validate v5.494 Active Ollama Model v2

on:
  push:
    branches: [fix/v5.494-active-ollama-model-resolver]
    paths:
      - .github/workflows/validate-v5-494-active-ollama-model-v2.yml

permissions:
  contents: write

jobs:
  validate-build-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply checksummed v5.494 source patch
        shell: bash
        run: |
          cat .github/scripts/v5494_patch.part* > /tmp/v5494_source.patch.gz.b64
          python - <<'PY'
          import base64, gzip, hashlib
          from pathlib import Path
          encoded = Path('/tmp/v5494_source.patch.gz.b64').read_text(encoding='utf-8').strip()
          assert hashlib.sha256(encoded.encode()).hexdigest() == 'bf4a6386ace585b6aeed65f141418a7569b417689395f92ce8ea8458e70abf50'
          raw = gzip.decompress(base64.b64decode(encoded))
          assert hashlib.sha256(raw).hexdigest() == '4553c6e052232ae152a2daf78a21c2d2f0a0ff23aca19b0d75222eacf094e331'
          Path('/tmp/v5494_source.patch').write_bytes(raw)
          print('v5.494 patch checksum PASS')
          PY
          git apply --check /tmp/v5494_source.patch
          git apply /tmp/v5494_source.patch
          sed -i 's/^OLLAMA_MODEL=qwen2\.5:7b$/OLLAMA_MODEL=qwen3.5:4b/' backend/.env.example

      - name: Validate backend and active-model contract
        shell: bash
        run: |
          python -m compileall -q backend/app
          python - <<'PY'
          from pathlib import Path
          root=Path('.')
          def read(path): return (root/path).read_text(encoding='utf-8')
          def req(path, token):
              if token not in read(path): raise AssertionError(f'{path}: missing {token}')
          req('backend/app/services/active_ollama_model_service.py', 'LEARNED_MODEL_NAME = "theanova-learn:latest"')
          req('backend/app/services/active_ollama_model_service.py', 'BASE_MODEL_NAME = LATEST_RECOMMENDED_MODEL')
          req('backend/app/services/llm_provider.py', 'model_name = current_runtime_ollama_model()')
          req('backend/app/services/model_router.py', 'return current_runtime_ollama_model()')
          req('backend/app/services/llm_runtime_status_service.py', 'selected = await resolve_active_ollama_model()')
          req('backend/app/services/llm_catalog_service.py', '"ollama_model": current_runtime_ollama_model()')
          req('backend/app/services/learning_teacher_router.py', 'active_ollama = await resolve_active_ollama_model()')
          req('backend/app/main.py', 'active_ollama = await sync_active_ollama_model()')
          req('backend/app/services/ollama_model_manager_service.py', 'invalidate_active_ollama_model_cache()')
          req('backend/app/core/config.py', 'ollama_model: str = "qwen3.5:4b"')
          req('backend/.env.example', 'OLLAMA_MODEL=qwen3.5:4b')
          req('backend/app/api/routes.py', 'operation="live_transcript_summary"')
          req('backend/app/api/routes.py', 'llm = model_for_task(LLMTask.SIMPLE_QUESTION)')
          req('backend/app/main.py', 'version="5.494"')
          req('backend/app/api/routes.py', '"version": "5.494"')
          req('frontend/src/App.jsx', "AGENTSTUDIO_FRONTEND_VERSION='5.494'")
          runtime_paths=[
              'backend/app/core/config.py','backend/.env.example','backend/app/services/llm_provider.py',
              'backend/app/services/model_router.py','backend/app/services/llm_catalog_service.py',
              'backend/app/services/learning_teacher_router.py','backend/app/services/llm_learning_service.py',
              'backend/app/services/llm_learning_pc_application_service.py',
          ]
          for path in runtime_paths:
              if 'qwen2.5' in read(path): raise AssertionError(f'legacy qwen2.5 runtime/default remains: {path}')
          print('v5.494 active Ollama model contract PASS')
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend clean production build
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Commit tested v5.494 source
        shell: bash
        run: |
          git config user.name "ynystory-gif"
          git config user.email "ynystory@gmail.com"
          git add README.md README_V5_494_ActiveOllamaModelResolver.md backend/.env.example backend/app frontend/src/App.jsx
          git commit -m "fix: unify active Ollama model resolution for v5.494"
          git push origin HEAD:fix/v5.494-active-ollama-model-resolver

      - name: Build clean distribution tree
        shell: bash
        run: |
          rm -rf package
          mkdir package
          rsync -a ./ package/ --exclude '.git' --exclude '.github' --exclude 'package' --exclude 'frontend/node_modules' --exclude 'frontend/dist' --exclude 'README_V5_*.md'
          cp README_V5_494_ActiveOllamaModelResolver.md package/
          python - <<'PY'
          from pathlib import Path
          root=Path('package')
          assert (root/'README.md').exists()
          assert (root/'backend/.env.example').exists()
          assert (root/'backend/app/services/active_ollama_model_service.py').exists()
          assert [p.name for p in root.glob('README_V5_*.md')] == ['README_V5_494_ActiveOllamaModelResolver.md']
          assert "AGENTSTUDIO_FRONTEND_VERSION='5.494'" in (root/'frontend/src/App.jsx').read_text(encoding='utf-8')
          assert 'version="5.494"' in (root/'backend/app/main.py').read_text(encoding='utf-8')
          assert 'OLLAMA_MODEL=qwen3.5:4b' in (root/'backend/.env.example').read_text(encoding='utf-8')
          print('v5.494 distribution contract PASS')
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: THEANOVA_AgentStudio_v5_494_ActiveOllamaModelResolver
          path: package
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
