name: Apply v5.485 Notebook Cell Resize

on:
  push:
    paths:
      - '.github/workflows/apply-v5-485-notebook-cell-resize.yml'

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python .github/scripts/apply_v5_485_notebook_resize.py
      - name: Remove one-shot patch helpers
        run: |
          rm -f .github/scripts/apply_v5_485_notebook_resize.py
          rm -f .github/workflows/apply-v5-485-notebook-cell-resize.yml
          git diff --check
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend build
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Commit tested patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: add draggable notebook code cell height for v5.485'
          git push origin HEAD:main
