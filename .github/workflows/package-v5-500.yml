name: Package v5.500

on:
  push:
    branches:
      - main

jobs:
  package:
    if: contains(github.event.head_commit.message, '[package-v5500]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate backend
        run: python -m compileall -q backend/app

      - name: Validate frontend build
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Validate release contract
        shell: python
        run: |
          from pathlib import Path
          app = Path('frontend/src/App.jsx').read_text(encoding='utf-8')
          main = Path('backend/app/main.py').read_text(encoding='utf-8')
          routes = Path('backend/app/api/routes.py').read_text(encoding='utf-8')
          assert "AGENTSTUDIO_FRONTEND_VERSION='5.500'" in app
          assert 'version="5.500"' in main
          assert '"version": "5.500"' in routes
          assert 'providerEnabledToggle' in app
          assert 'ToolPromptSettingsPanel' in app
          print('v5.500 release contract PASS')

      - name: Build distribution zip
        shell: bash
        run: |
          rm -rf /tmp/agentstudio-dist
          mkdir -p /tmp/agentstudio-dist/THEANOVA_AgentStudio_v5_500_InterviewQuestionStateEventSave
          rsync -a ./ /tmp/agentstudio-dist/THEANOVA_AgentStudio_v5_500_InterviewQuestionStateEventSave/ \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'frontend/node_modules' \
            --exclude 'frontend/dist' \
            --exclude '__pycache__' \
            --exclude '*.pyc' \
            --exclude 'README_V5_*.md'
          cp README_V5_500_InterviewQuestionStateEventSave.md /tmp/agentstudio-dist/THEANOVA_AgentStudio_v5_500_InterviewQuestionStateEventSave/
          cd /tmp/agentstudio-dist
          zip -qr "$GITHUB_WORKSPACE/THEANOVA_AgentStudio_v5_500_InterviewQuestionStateEventSave.zip" THEANOVA_AgentStudio_v5_500_InterviewQuestionStateEventSave
          unzip -t "$GITHUB_WORKSPACE/THEANOVA_AgentStudio_v5_500_InterviewQuestionStateEventSave.zip" >/dev/null
          sha256sum "$GITHUB_WORKSPACE/THEANOVA_AgentStudio_v5_500_InterviewQuestionStateEventSave.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: THEANOVA_AgentStudio_v5_500_InterviewQuestionStateEventSave
          path: THEANOVA_AgentStudio_v5_500_InterviewQuestionStateEventSave.zip
          if-no-files-found: error
