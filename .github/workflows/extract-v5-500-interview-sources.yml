name: Extract v5.500 Interview Sources

on:
  push:
    branches:
      - main

jobs:
  extract:
    if: contains(github.event.head_commit.message, '[extract-v5500]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Collect source files
        run: |
          mkdir -p _v5500_sources/frontend/src _v5500_sources/backend/app/services _v5500_sources/backend/app/api
          cp frontend/src/App.jsx _v5500_sources/frontend/src/App.jsx
          cp backend/app/services/requirements_agent.py _v5500_sources/backend/app/services/requirements_agent.py
          cp backend/app/api/routes.py _v5500_sources/backend/app/api/routes.py
          cp README.md _v5500_sources/README.md
      - uses: actions/upload-artifact@v4
        with:
          name: v5500-interview-sources
          path: _v5500_sources
          if-no-files-found: error
