name: Validate v5.496 RAG Production Coding Style

on:
  push:
    branches: [fix/v5.496-rag-production-coding-style]
    paths:
      - .github/workflows/validate-v5-496-rag-production-coding-style.yml

permissions:
  contents: write

jobs:
  validate-build-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply checksummed v5.496 source patch
        shell: bash
        run: |
          python - <<'PY'
          import base64, gzip, hashlib
          from pathlib import Path
          encoded = Path('.github/scripts/v5496_source.patch.gz.b64').read_text(encoding='utf-8').strip()
          expected_encoded = '1f996e28d6f85a2a948b139f1181fb8bc4fd5ee383af1f33c2317c9984b0262c'
          actual_encoded = hashlib.sha256(encoded.encode('utf-8')).hexdigest()
          if actual_encoded != expected_encoded:
              raise AssertionError(f'encoded patch checksum mismatch: {actual_encoded}')
          raw = gzip.decompress(base64.b64decode(encoded))
          expected_raw = 'eb1c48f4b2cc69d19436938542a307cb62767d7525adbc6e132d71f9540d5560'
          actual_raw = hashlib.sha256(raw).hexdigest()
          if actual_raw != expected_raw:
              raise AssertionError(f'raw patch checksum mismatch: {actual_raw}')
          Path('/tmp/v5496_source.patch').write_bytes(raw)
          print('v5.496 patch checksum PASS')
          PY
          git apply --check /tmp/v5496_source.patch
          git apply /tmp/v5496_source.patch

      - name: Validate backend and RAG coding style contract
        shell: bash
        run: |
          python -m compileall -q backend/app
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('.')
          registry = json.loads((root/'backend/app/data/coding_style/rules.json').read_text(encoding='utf-8'))
          assert registry['version'] == '2.1'
          assert [row.get('id') for row in registry['rules'][-8:]] == [f'CS-{n}' for n in range(170, 178)]
          app = (root/'frontend/src/App.jsx').read_text(encoding='utf-8')
          workflow = (root/'backend/app/services/agent_workflow.py').read_text(encoding='utf-8')
          keys = [
              'rag_index_query_separation', 'rag_parameter_settings', 'retrieval_relevance_gate',
              'grounded_answer_contract', 'context_budget_management', 'idempotent_indexing',
              'retrieval_observability', 'retrieved_context_instruction_guard',
          ]
          for key in keys:
              assert f'{key}:true' in app, key
              assert f'"{key}": True' in workflow, key
          assert "AGENTSTUDIO_FRONTEND_VERSION='5.496'" in app
          assert 'version="5.496"' in (root/'backend/app/main.py').read_text(encoding='utf-8')
          assert '"version": "5.496"' in (root/'backend/app/api/routes.py').read_text(encoding='utf-8')
          assert (root/'backend/app/data/coding_style/sources/rag_minimum_pipeline_notebook.md').exists()
          print('v5.496 static contract PASS')
          PY
          PYTHONPATH=backend python - <<'PY'
          from app.services.coding_rule_selector import coding_rules_for_request
          result = coding_rules_for_request(
              'RAG Agent를 만들고 Chroma vectorstore로 문서를 색인한 뒤 retriever Top-K 관련도 score threshold, 근거 없으면 abstain, context token budget, 재색인 checksum, retrieval trace, prompt injection 방어를 적용해줘',
              path='services/rag_service.py',
              project_scope=True,
          )
          selected = {row.get('id') for row in result.get('rules') or []}
          required = {f'CS-{n}' for n in range(170, 178)}
          missing = sorted(required - selected)
          if missing:
              raise AssertionError(f'v5.496 selector missing: {missing}')
          print('v5.496 selector PASS', sorted(required))
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend clean production build
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Commit tested v5.496 source
        shell: bash
        run: |
          git config user.name "ynystory-gif"
          git config user.email "ynystory@gmail.com"
          git add README.md README_V5_496_RagProductionCodingStyle.md frontend/src/App.jsx backend/app/main.py backend/app/api/routes.py backend/app/services/agent_workflow.py backend/app/services/coding_rule_selector.py
          git add -f backend/app/data/coding_style/rules.json backend/app/data/coding_style/sources/rag_minimum_pipeline_notebook.md
          git commit -m "feat: add production RAG coding style for v5.496"
          git push origin HEAD:fix/v5.496-rag-production-coding-style

      - name: Build clean distribution tree
        shell: bash
        run: |
          rm -rf package
          mkdir package
          rsync -a ./ package/ \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'package' \
            --exclude 'frontend/node_modules' \
            --exclude 'frontend/dist' \
            --exclude 'backend/app/**/__pycache__' \
            --exclude '*.pyc' \
            --exclude 'README_V5_*.md'
          cp README_V5_496_RagProductionCodingStyle.md package/
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('package')
          assert (root/'README.md').exists()
          assert [p.name for p in root.glob('README_V5_*.md')] == ['README_V5_496_RagProductionCodingStyle.md']
          assert "AGENTSTUDIO_FRONTEND_VERSION='5.496'" in (root/'frontend/src/App.jsx').read_text(encoding='utf-8')
          assert 'version="5.496"' in (root/'backend/app/main.py').read_text(encoding='utf-8')
          assert '"version": "5.496"' in (root/'backend/app/api/routes.py').read_text(encoding='utf-8')
          registry = json.loads((root/'backend/app/data/coding_style/rules.json').read_text(encoding='utf-8'))
          assert registry['version'] == '2.1'
          assert all(any(r.get('id') == f'CS-{n}' for r in registry['rules']) for n in range(170, 178))
          assert (root/'backend/app/data/coding_style/sources/rag_minimum_pipeline_notebook.md').exists()
          assert not any(root.rglob('__pycache__'))
          print('v5.496 distribution contract PASS')
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: THEANOVA_AgentStudio_v5_496_RagProductionCodingStyle
          path: package
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
