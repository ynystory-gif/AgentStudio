name: Validate v5.493 Runtime Path Policy

on:
  push:
    branches: [fix/v5.493-runtime-path-policy]

permissions:
  contents: write

jobs:
  validate-build-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply v5.493 patch
        shell: bash
        run: |
          python - <<'PY'
          import base64, gzip
          from pathlib import Path
          encoded = Path('.github/scripts/apply_v5493_runtime_path_policy.py.gz.b64').read_text(encoding='utf-8').strip()
          Path('/tmp/apply_v5493.py').write_bytes(gzip.decompress(base64.b64decode(encoded)))
          PY
          python /tmp/apply_v5493.py

      - name: Validate backend and runtime path contract
        run: |
          python -m compileall -q backend/app
          python backend/validate_v5493_runtime_path_policy_contract.py

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend clean build
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Commit tested v5.493 source
        shell: bash
        run: |
          git config user.name "ynystory-gif"
          git config user.email "ynystory@gmail.com"
          git add -A
          git reset -- .github/workflows/validate-v5-493-runtime-path-policy.yml .github/scripts/apply_v5493_runtime_path_policy.py.gz.b64
          git commit -m "feat: apply runtime temp cache output paths for v5.493"
          git push origin HEAD:fix/v5.493-runtime-path-policy

      - name: Build clean distribution tree
        shell: bash
        run: |
          rm -rf package
          mkdir package
          rsync -a ./ package/ --exclude '.git' --exclude '.github' --exclude 'package' --exclude 'frontend/node_modules' --exclude 'frontend/dist' --exclude 'README_V5_*.md'
          cp README_V5_493_RuntimePathPolicy.md package/
          python - <<'PY'
          from pathlib import Path
          root=Path('package')
          assert (root/'README.md').exists()
          assert [p.name for p in root.glob('README_V5_*.md')] == ['README_V5_493_RuntimePathPolicy.md']
          assert "AGENTSTUDIO_FRONTEND_VERSION='5.493'" in (root/'frontend/src/App.jsx').read_text(encoding='utf-8')
          assert 'version="5.493"' in (root/'backend/app/main.py').read_text(encoding='utf-8')
          assert (root/'backend/app/services/runtime_path_policy.py').exists()
          print('distribution contract PASS')
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: THEANOVA_AgentStudio_v5_493_RuntimePathPolicy
          path: package
          if-no-files-found: error
          retention-days: 90
