name: Validate v5.489 Windows Python Runtime

on:
  push:
    branches:
      - fix/v5.489-windows-python-worker-runtime
    paths:
      - '.github/workflows/validate-v5-489-windows-runtime.yml'

permissions:
  contents: write

env:
  PATCH_GZ_B64: 

jobs:
  apply-build-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v5.489-windows-python-worker-runtime
          fetch-depth: 0
      - name: Apply structural patch
        shell: bash
        run: |
          python - <<'PY'
          import base64, gzip, os
          from pathlib import Path
          payload = base64.b64decode(os.environ['PATCH_GZ_B64'])
          Path('.github/apply_v5489.py').write_bytes(gzip.decompress(payload))
          PY
          python .github/apply_v5489.py
      - name: Backend syntax and runtime contract
        run: |
          python -m py_compile backend/app/services/python_execution_service.py backend/app/services/python_worker_runtime.py backend/app/api/routes.py backend/app/main.py
          python backend/validate_v5489_windows_python_worker_runtime_contract.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend clean build
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Commit tested v5.489 source
        run: |
          git config user.name "ynystory-gif"
          git config user.email "ynystory@gmail.com"
          git add backend/app/services/python_execution_service.py backend/app/services/python_worker_runtime.py backend/app/api/routes.py backend/app/main.py frontend/src/App.jsx README.md README_V5_489_WindowsPythonWorkerRuntimeFix.md backend/validate_v5489_windows_python_worker_runtime_contract.py
          git commit -m "fix: externalize Python worker runtime for v5.489"
          git push origin HEAD:fix/v5.489-windows-python-worker-runtime

  windows-runtime-regression:
    needs: apply-build-commit
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v5.489-windows-python-worker-runtime
          fetch-depth: 0
      - name: Refresh tested branch head
        shell: pwsh
        run: |
          git fetch origin fix/v5.489-windows-python-worker-runtime
          git checkout -B fix/v5.489-windows-python-worker-runtime origin/fix/v5.489-windows-python-worker-runtime
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Windows worker CreateProcess regression
        shell: pwsh
        run: |
          python -m py_compile backend/app/services/python_execution_service.py backend/app/services/python_worker_runtime.py
          python backend/validate_v5489_windows_python_worker_runtime_contract.py
