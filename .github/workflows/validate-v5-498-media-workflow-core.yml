name: Validate v5.498 Media Workflow Core

on:
  push:
    branches: [fix/v5.498-media-workflow-core]
    paths:
      - .github/workflows/validate-v5-498-media-workflow-core.yml

permissions:
  contents: write

jobs:
  validate-build-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply v5.498 AgentStudio core integration
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise AssertionError(f'{path}: expected 1 match, got {count}: {old[:100]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          def replace_all(path, old, new, minimum=1):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count < minimum:
                  raise AssertionError(f'{path}: expected >= {minimum} matches, got {count}: {old[:100]!r}')
              p.write_text(text.replace(old, new), encoding='utf-8')
              return count

          factory = 'backend/app/services/agent_factory_workflow_design.py'
          replace_once(
              factory,
              'from app.services.blender_3d_agent_design import enforce_blender_3d_agent_design, is_blender_3d_agent_request, is_blender_3d_design\n',
              'from app.services.blender_3d_agent_design import enforce_blender_3d_agent_design, is_blender_3d_agent_request, is_blender_3d_design\nfrom app.services.media_agent_design import enforce_media_agent_design, is_media_agent_design\n',
          )
          replace_once(
              factory,
              '\n\nSYSTEM = """당신은 THEANOVA AgentStudio의 Agent Factory 설계 엔진입니다.\n',
              '\n\ndef _enforce_specialized_agent_design(design: dict, request: str) -> dict:\n    design = enforce_blender_3d_agent_design(design, request)\n    return enforce_media_agent_design(design, request)\n\n\nSYSTEM = """당신은 THEANOVA AgentStudio의 Agent Factory 설계 엔진입니다.\n',
          )
          replace_all(factory, '= enforce_blender_3d_agent_design(', '= _enforce_specialized_agent_design(', minimum=5)
          replace_once(
              factory,
              '"file_plan", "settings_plan", "test_environment_plan", "three_d_agent_plan", "environment_plan",\n',
              '"file_plan", "settings_plan", "test_environment_plan", "three_d_agent_plan", "media_agent_plan", "environment_plan",\n',
          )
          replace_once(
              factory,
              '"agent_specialization": {"requirement_spec", "capability_plan", "tool_mcp_plan", "agent_architecture", "target_agent_workflow", "file_plan", "settings_plan", "test_environment_plan", "three_d_agent_plan", "environment_plan"},\n',
              '"agent_specialization": {"requirement_spec", "capability_plan", "tool_mcp_plan", "agent_architecture", "target_agent_workflow", "file_plan", "settings_plan", "test_environment_plan", "three_d_agent_plan", "media_agent_plan", "environment_plan"},\n',
          )
          replace_once(
              factory,
              '    preserve_blender_specialization = is_blender_3d_design(previous_design, request)\n',
              '    preserve_blender_specialization = is_blender_3d_design(previous_design, request)\n    preserve_media_specialization = is_media_agent_design(previous_design, request)\n',
          )
          replace_all(
              factory,
              '        if preserve_blender_specialization:\n            result.setdefault("design_runtime", {})["agent_specialization"] = "BLENDER_3D"\n            result = _enforce_specialized_agent_design(result, request)\n',
              '        if preserve_blender_specialization:\n            result.setdefault("design_runtime", {})["agent_specialization"] = "BLENDER_3D"\n            result = _enforce_specialized_agent_design(result, request)\n        if preserve_media_specialization:\n            result.setdefault("design_runtime", {})["agent_specialization"] = "MEDIA_CREATION"\n            result = _enforce_specialized_agent_design(result, request)\n',
              minimum=2,
          )
          replace_once(
              factory,
              '"type": "input|validation|mcp_client|transport|mcp_server|tool|llm|ui|storage|decision|complete"\n',
              '"type": "input|validation|mcp_client|transport|mcp_server|tool|llm|ui|storage|decision|complete|media_input|media_analysis|media_plan|media_process|media_generate|media_validate|approval|preview"\n',
          )
          replace_once(
              factory,
              '- 기존 프로젝트라면 기존 구조를 최대한 유지합니다.\n',
              '- 기존 프로젝트라면 기존 구조를 최대한 유지합니다.\n- Media Agent는 ComfyUI 저수준 그래프를 복제하지 않고 고수준 Media Node → Provider Adapter → 외부 Engine 구조를 사용합니다.\n- Media Workflow는 기존 Workflow Schema를 additive extension으로 확장하고 Typed Port/Artifact/Async Job/Provider Capability/Validator/Approval 계약을 유지합니다.\n',
          )

          app = 'frontend/src/App.jsx'
          replace_once(app, "const AGENTSTUDIO_FRONTEND_VERSION='5.497'", "const AGENTSTUDIO_FRONTEND_VERSION='5.498'")
          replace_once(
              app,
              "    description:'SceneSpec → Validator → LangGraph State → Blender MCP → Viewport QA → 수정 → Render/Export 구조를 기본 적용합니다.'\n  }\n]",
              "    description:'SceneSpec → Validator → LangGraph State → Blender MCP → Viewport QA → 수정 → Render/Export 구조를 기본 적용합니다.'\n  },\n  {\n    id:'MEDIA_CREATION',\n    label:'미디어 생성·처리 Agent',\n    icon:'▧',\n    description:'고수준 Media Node → Provider Adapter → ComfyUI/Diffusers/API → Validator → Retry → Human Approval 구조를 기본 적용합니다.'\n  }\n]",
          )
          replace_once(
              app,
              "    if(\n      text.includes('complete')\n      || text.includes('완료')\n    ) return 'COMPLETE'\n",
              "    const explicitType=String(step?.type||'').toLowerCase()\n    if(explicitType==='media_input') return 'MEDIA_INPUT'\n    if(explicitType==='media_analysis') return 'MEDIA_ANALYSIS'\n    if(explicitType==='media_plan') return 'MEDIA_PLAN'\n    if(explicitType==='media_process'||explicitType==='media_generate') return 'MEDIA_EXECUTION'\n    if(explicitType==='media_validate') return 'QA'\n    if(explicitType==='approval') return 'APPROVAL'\n    if(explicitType==='preview') return 'PREVIEW'\n\n    if(\n      text.includes('complete')\n      || text.includes('완료')\n    ) return 'COMPLETE'\n",
          )
          replace_once(
              app,
              "    {\n      id:'MCP',\n      title:'MCP / Tool 실행',\n",
              "    {\n      id:'MEDIA_INPUT',\n      title:'Media 입력',\n      subtitle:'Image · Video · Audio · Asset',\n      icon:'▧'\n    },\n    {\n      id:'MEDIA_ANALYSIS',\n      title:'Media 분석',\n      subtitle:'Vision · OCR · Quality · Object',\n      icon:'◎'\n    },\n    {\n      id:'MEDIA_PLAN',\n      title:'Media 계획',\n      subtitle:'Prompt · Style · Layout · Scene',\n      icon:'✦'\n    },\n    {\n      id:'MEDIA_EXECUTION',\n      title:'Media 생성/처리',\n      subtitle:'Provider · Job · Generate · Process',\n      icon:'▶'\n    },\n    {\n      id:'APPROVAL',\n      title:'Human Approval',\n      subtitle:'승인 · 수정 요청 · 재생성',\n      icon:'✓'\n    },\n    {\n      id:'PREVIEW',\n      title:'Media Preview',\n      subtitle:'Image · Video · Before/After',\n      icon:'◫'\n    },\n    {\n      id:'MCP',\n      title:'MCP / Tool 실행',\n",
          )

          main = 'backend/app/main.py'
          replace_once(main, 'from app.api.scheduler_routes import router as scheduler_router\n', 'from app.api.scheduler_routes import router as scheduler_router\nfrom app.api.media_workflow_routes import router as media_workflow_router\n')
          replace_once(main, 'app = FastAPI(title="THEANOVA AgentStudio", version="5.497", lifespan=lifespan)', 'app = FastAPI(title="THEANOVA AgentStudio", version="5.498", lifespan=lifespan)')
          replace_once(main, 'app.include_router(scheduler_router, prefix="/api")\n', 'app.include_router(scheduler_router, prefix="/api")\napp.include_router(media_workflow_router, prefix="/api")\n')

          routes = 'backend/app/api/routes.py'
          replace_all(routes, '"version": "5.497"', '"version": "5.498"', minimum=1)

          readme = Path('README.md')
          readme.write_text(
              '## v5.498 Media Workflow Core\n\n'
              '- Agent Creator/Editor 정체성을 유지하면서 미디어 생성·처리 Agent 설계용 고수준 Workflow Core를 추가했습니다.\n'
              '- Typed Media Port, Media Artifact, Async Media Job, Provider Adapter 계약과 additive Workflow extensions.media Schema를 추가했습니다.\n'
              '- ComfyUI는 저수준 Node Editor가 아니라 외부 실행 Provider로 취급하며 Provider Capability/Health/Workflow readiness를 기준으로 선택합니다.\n'
              '- Media Agent 전문화 설계를 추가해 생성→검증→기술 Retry/품질 Retry→Human Approval→저장 Workflow를 Agent Factory가 보존합니다.\n'
              '- 기존 Workflow와 Agent 실행 기능은 변경 없이 읽히도록 Backward Compatibility를 유지합니다.\n\n'
              + readme.read_text(encoding='utf-8'), encoding='utf-8'
          )
          Path('README_V5_498_MediaWorkflowCore.md').write_text('''# THEANOVA AgentStudio v5.498 — Media Workflow Core\n\n## 목적\nAgentStudio를 ComfyUI 복제품으로 만들지 않고 Agent Creator / Agent Editor가 미디어 생성·처리 Agent를 설계·생성·수정할 수 있도록 기존 Workflow Core를 확장합니다.\n\n## 이번 버전\n- 고수준 Media Node Registry와 Typed Port 계약\n- Media Artifact / Async Job 상태 계약\n- Provider Adapter 공통 계약(health/capabilities/submit/status/result/cancel)\n- 기존 Workflow Schema를 교체하지 않는 `extensions.media` additive extension\n- Media Agent 전문화 설계 및 증분 수정 시 specialization 보존\n- ComfyUI를 외부 Provider로 계획하고 Workflow JSON/Input/Output Mapping/Queue/Progress/Cancel 책임 분리\n- 기술 Retry와 품질 Correction Retry 분리\n- Human Approval을 WAITING_APPROVAL interrupt/resume로 설계\n- Target Workflow UI에서 Media Input/Analysis/Plan/Execution/Approval/Preview 그룹 표시\n- `/api/media/workflow/catalog`, `/contracts`, `/validate-port`, `/normalize`, `/validate` 제공\n\n## 단계\n현재 v5.498은 Media Workflow Core와 Agent Factory 설계 계약을 먼저 확장한 단계입니다. 실제 Provider 실행 구현은 생성 대상 Agent의 Adapter로 생성되며, AgentStudio 자체에는 ComfyUI의 KSampler/VAE/Checkpoint 같은 저수준 Node를 복제하지 않습니다.\n''', encoding='utf-8')
          print('v5.498 integration migration PASS')
          PY

      - name: Validate backend media contracts and specialization
        shell: bash
        run: |
          python -m compileall -q backend/app
          PYTHONPATH=backend python - <<'PY'
          from app.services.media_workflow_core import media_node_catalog, is_media_port_connection_allowed, normalize_workflow_media_extension, validate_media_workflow_definition
          from app.services.media_agent_design import enforce_media_agent_design

          catalog = media_node_catalog()
          types = {row['type'] for row in catalog}
          for required in {'IMAGE_INPUT','IMAGE_GENERATE','IMAGE_TO_IMAGE','BACKGROUND_REMOVE','OCR_VALIDATOR','IMAGE_QUALITY_VALIDATOR','HUMAN_APPROVAL','SAVE_IMAGE','TEXT_TO_VIDEO','IMAGE_TO_VIDEO'}:
              assert required in types, required
          assert is_media_port_connection_allowed('TEXT', 'PROMPT')
          assert is_media_port_connection_allowed('IMAGE', 'IMAGE')
          assert not is_media_port_connection_allowed('VIDEO', 'IMAGE')
          legacy = {'steps':[{'name':'legacy'}]}
          normalized = normalize_workflow_media_extension(legacy)
          assert normalized['steps'] == legacy['steps']
          assert normalized['extensions']['media']['schema_version'] == 1
          invalid = validate_media_workflow_definition({'nodes':[{'id':'a','type':'IMAGE_INPUT'},{'id':'b','type':'SAVE_IMAGE'}], 'edges':[{'source':'a','target':'b','output_type':'VIDEO','input_type':'IMAGE'}]})
          assert invalid['valid'] is False

          design = enforce_media_agent_design({}, 'ComfyUI를 사용해서 상품 이미지 배경을 바꾸고 원본 제품을 검증하는 이미지 생성 Agent를 만들어줘')
          assert design['media_agent_plan']['type'] == 'MEDIA_CREATION'
          assert design['design_runtime']['agent_specialization'] == 'MEDIA_CREATION'
          steps = {row['name'] for row in design['target_agent_workflow']['steps']}
          for required in {'resolve_media_provider','submit_media_job','validate_media_result','human_media_approval','save_media_output'}:
              assert required in steps, required
          assert any(row.get('target') == 'submit_media_job' for row in design['target_agent_workflow']['retry_policy'])
          assert any(row.get('target') == 'validate_media_result' for row in design['target_agent_workflow']['retry_policy'])
          print('v5.498 backend media contract PASS', len(catalog))
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend clean production build
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Validate version and integration contracts
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          app = Path('frontend/src/App.jsx').read_text(encoding='utf-8')
          factory = Path('backend/app/services/agent_factory_workflow_design.py').read_text(encoding='utf-8')
          main = Path('backend/app/main.py').read_text(encoding='utf-8')
          routes = Path('backend/app/api/routes.py').read_text(encoding='utf-8')
          assert "AGENTSTUDIO_FRONTEND_VERSION='5.498'" in app
          assert "id:'MEDIA_CREATION'" in app
          assert "id:'MEDIA_EXECUTION'" in app
          assert 'media_agent_plan' in factory
          assert 'preserve_media_specialization' in factory
          assert 'enforce_media_agent_design' in factory
          assert 'version="5.498"' in main
          assert 'media_workflow_router' in main
          assert '"version": "5.498"' in routes
          print('v5.498 integration contract PASS')
          PY

      - name: Commit tested v5.498 source
        shell: bash
        run: |
          git config user.name "ynystory-gif"
          git config user.email "ynystory@gmail.com"
          git add README.md README_V5_498_MediaWorkflowCore.md frontend/src/App.jsx backend/app/main.py backend/app/api/routes.py backend/app/api/media_workflow_routes.py backend/app/services/media_workflow_core.py backend/app/services/media_agent_design.py backend/app/services/agent_factory_workflow_design.py
          git commit -m "feat: expand AgentStudio with media workflow core v5.498"
          git push origin HEAD:fix/v5.498-media-workflow-core

      - name: Build clean distribution tree
        shell: bash
        run: |
          rm -rf package
          mkdir package
          rsync -a ./ package/ \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'package' \
            --exclude 'frontend/node_modules' \
            --exclude 'frontend/dist' \
            --exclude 'backend/app/**/__pycache__' \
            --exclude '*.pyc' \
            --exclude 'README_V5_*.md'
          cp README_V5_498_MediaWorkflowCore.md package/
          python - <<'PY'
          from pathlib import Path
          root = Path('package')
          assert (root/'README.md').exists()
          assert [p.name for p in root.glob('README_V5_*.md')] == ['README_V5_498_MediaWorkflowCore.md']
          assert "AGENTSTUDIO_FRONTEND_VERSION='5.498'" in (root/'frontend/src/App.jsx').read_text(encoding='utf-8')
          assert (root/'backend/app/services/media_workflow_core.py').exists()
          assert (root/'backend/app/services/media_agent_design.py').exists()
          assert (root/'backend/app/api/media_workflow_routes.py').exists()
          assert not any(root.rglob('__pycache__'))
          assert not any(root.rglob('*.pyc'))
          print('v5.498 distribution contract PASS')
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: THEANOVA_AgentStudio_v5_498_MediaWorkflowCore
          path: package
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
