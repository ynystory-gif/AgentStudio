name: Apply v5.486 Pinned Tabs Left Priority

on:
  push:
    paths:
      - '.github/workflows/apply-v5-486-pinned-tabs-left.yml'

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply pinned tab ordering patch
        run: python .github/scripts/apply_v5_486_pinned_tabs_left.py

      - name: Remove one-shot patch helpers
        run: |
          rm -f .github/scripts/apply_v5_486_pinned_tabs_left.py
          rm -f .github/workflows/apply-v5-486-pinned-tabs-left.yml
          git diff --check

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend build
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Commit tested patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: group pinned editor tabs at left for v5.486'
          git push origin HEAD:${GITHUB_REF_NAME}
