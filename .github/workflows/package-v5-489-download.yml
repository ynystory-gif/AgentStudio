name: Package v5.489 Download

on:
  push:
    paths:
      - '.github/workflows/package-v5-489-download.yml'

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: f114100a9c9caab568c712f41a58f4f69441c3d4
      - name: Build clean distribution tree
        shell: bash
        run: |
          mkdir -p dist/THEANOVA_AgentStudio_v5_489_WindowsPythonWorkerRuntimeFix
          rsync -a --exclude '.git' --exclude '.github/workflows/package-v5-489-download.yml' ./ dist/THEANOVA_AgentStudio_v5_489_WindowsPythonWorkerRuntimeFix/
          find dist/THEANOVA_AgentStudio_v5_489_WindowsPythonWorkerRuntimeFix -maxdepth 1 -type f -name 'README_V5_*.md' ! -name 'README_V5_489_WindowsPythonWorkerRuntimeFix.md' -delete
      - uses: actions/upload-artifact@v4
        with:
          name: THEANOVA_AgentStudio_v5_489_WindowsPythonWorkerRuntimeFix
          path: dist/THEANOVA_AgentStudio_v5_489_WindowsPythonWorkerRuntimeFix
          if-no-files-found: error
          retention-days: 7
