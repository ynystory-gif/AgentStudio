name: Validate v5.490 Notebook Warning Output

on:
  push:
    branches:
      - fix/v5.490-notebook-warning-output
    paths:
      - .github/workflows/validate-v5-490-warning-output.yml

permissions:
  contents: write

jobs:
  build-test-package:
    runs-on: ubuntu-latest
    env:
      PATCH_SCRIPT_GZ_B64: 
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v5.490-notebook-warning-output
          fetch-depth: 0
      - name: Apply v5.490 patch
        shell: bash
        run: |
          python - <<'PY'
          import base64, gzip, os
          from pathlib import Path
          Path('/tmp/apply_v5490.py').write_bytes(gzip.decompress(base64.b64decode(os.environ['PATCH_SCRIPT_GZ_B64'])))
          PY
          python /tmp/apply_v5490.py
      - name: Validate backend and warning contract
        shell: bash
        run: |
          python backend/validate_v5490_notebook_warning_output_contract.py
          python -m py_compile backend/app/main.py backend/app/api/routes.py backend/app/services/python_execution_service.py backend/app/services/python_worker_runtime.py backend/validate_v5490_notebook_warning_output_contract.py
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend clean build
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Commit tested source
        shell: bash
        run: |
          git config user.name "ynystory-gif"
          git config user.email "ynystory@gmail.com"
          git rm .github/workflows/validate-v5-490-warning-output.yml
          git add -A
          git commit -m "fix: classify Notebook warnings separately for v5.490"
          git push origin HEAD:fix/v5.490-notebook-warning-output
      - name: Build clean distribution tree
        shell: bash
        run: |
          rm -rf /tmp/dist-v5490
          mkdir -p /tmp/dist-v5490
          rsync -a ./ /tmp/dist-v5490/ \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='frontend/node_modules' \
            --exclude='frontend/dist' \
            --exclude='**/__pycache__' \
            --exclude='*.pyc' \
            --exclude='logs' \
            --exclude='backend/logs'
          find /tmp/dist-v5490 -maxdepth 1 -type f -name 'README_V5_*.md' ! -name 'README_V5_490_NotebookWarningOutputClassification.md' -delete
      - uses: actions/upload-artifact@v4
        with:
          name: THEANOVA_AgentStudio_v5_490_NotebookWarningOutputClassification
          path: /tmp/dist-v5490
          if-no-files-found: error
          retention-days: 7
