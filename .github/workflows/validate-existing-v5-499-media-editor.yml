name: Validate Existing v5.499 Media Editor

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate-build-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v5.499-media-workflow-editor-ui
          fetch-depth: 0

      - name: Validate source contracts
        shell: bash
        run: |
          python -m compileall -q backend/app
          python - <<'PY'
          from pathlib import Path
          app=Path('frontend/src/App.jsx').read_text(encoding='utf-8')
          component=Path('frontend/src/components/media/MediaWorkflowEditor.jsx').read_text(encoding='utf-8')
          service=Path('frontend/src/services/mediaWorkflowApi.js').read_text(encoding='utf-8')
          factory=Path('backend/app/services/agent_factory_workflow_design.py').read_text(encoding='utf-8')
          assert "AGENTSTUDIO_FRONTEND_VERSION='5.499'" in app
          assert "import { MediaWorkflowEditor }" in app
          assert "function TargetWorkflowDiagram({workflow,onWorkflowChange})" in app
          assert "media-workflow-editor-open" in app
          assert "onWorkflowChange" in app
          assert "design = enforce_blender_3d_agent_design(design, request)" in factory
          assert "return enforce_media_agent_design(design, request)" in factory
          for endpoint in ('/media/workflow/catalog','/media/workflow/validate-port','/media/workflow/normalize','/media/workflow/validate'):
              assert endpoint in service, endpoint
          for marker in ('draggable','connectToInput','Node 설정','Preview / Job 상태','JSON 가져오기','JSON 내보내기','EDITOR MODE'):
              assert marker in component, marker
          assert 'version="5.499"' in Path('backend/app/main.py').read_text(encoding='utf-8')
          assert '"version": "5.499"' in Path('backend/app/api/routes.py').read_text(encoding='utf-8')
          print('v5.499 existing source contract PASS')
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend clean production build
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Build clean distribution tree
        shell: bash
        run: |
          rm -rf package && mkdir package
          rsync -a ./ package/ --exclude '.git' --exclude '.github' --exclude 'package' --exclude 'frontend/node_modules' --exclude 'frontend/dist' --exclude '__pycache__' --exclude '*.pyc' --exclude 'README_V5_*.md'
          cp README_V5_499_MediaWorkflowEditorUI.md package/
          find package -type d -name '__pycache__' -prune -exec rm -rf {} +
          find package -type f -name '*.pyc' -delete
          python - <<'PY'
          from pathlib import Path
          root=Path('package')
          assert (root/'README.md').exists()
          assert [p.name for p in root.glob('README_V5_*.md')] == ['README_V5_499_MediaWorkflowEditorUI.md']
          assert (root/'frontend/src/components/media/MediaWorkflowEditor.jsx').exists()
          assert (root/'frontend/src/components/media/MediaWorkflowEditor.css').exists()
          assert (root/'frontend/src/services/mediaWorkflowApi.js').exists()
          assert not (root/'.github').exists()
          assert not any(root.rglob('__pycache__'))
          assert not any(root.rglob('*.pyc'))
          print('v5.499 distribution contract PASS')
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: THEANOVA_AgentStudio_v5_499_MediaWorkflowEditorUI
          path: package
          if-no-files-found: error
