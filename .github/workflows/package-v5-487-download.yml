name: Package v5.487 Download

on:
  push:
    paths:
      - '.github/workflows/package-v5-487-download.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  SOURCE_REF: a88697f6965ff362692ceda5a774ec6a5007fd5b
  PACKAGE_NAME: THEANOVA_AgentStudio_v5_487_ImagePreviewNotebookRichResult

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact v5.487 source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_REF }}

      - name: Build clean distribution tree
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "release/${PACKAGE_NAME}"
          rsync -a ./ "release/${PACKAGE_NAME}/" \
            --exclude '.git/' \
            --exclude 'release/'

          find "release/${PACKAGE_NAME}" -maxdepth 1 -type f -name 'README_V5_*.md' \
            ! -name 'README_V5_487_ImagePreviewNotebookRichResult.md' -delete

          test -f "release/${PACKAGE_NAME}/README.md"
          test -f "release/${PACKAGE_NAME}/README_V5_487_ImagePreviewNotebookRichResult.md"
          grep -q "AGENTSTUDIO_FRONTEND_VERSION='5.487'" "release/${PACKAGE_NAME}/frontend/src/App.jsx"
          grep -q '"version": "5.487"' "release/${PACKAGE_NAME}/backend/app/api/routes.py"

      - name: Upload v5.487 full source artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PACKAGE_NAME }}
          path: release/${{ env.PACKAGE_NAME }}/
          include-hidden-files: true
          if-no-files-found: error
          compression-level: 6
          retention-days: 7
