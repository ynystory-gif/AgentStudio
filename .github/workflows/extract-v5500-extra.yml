name: Extract v5.500 Extra Sources

on:
  push:
    branches:
      - fix/v5.500-interview-question-state

jobs:
  extract:
    if: contains(github.event.head_commit.message, '[extract-v5500-extra]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Collect extra sources
        run: |
          mkdir -p _src/frontend/src/components/ai _src/frontend/src
          cp frontend/src/styles.css _src/frontend/src/styles.css
          cp frontend/src/components/ai/AiAttachmentPicker.tsx _src/frontend/src/components/ai/AiAttachmentPicker.tsx
          cp frontend/package.json _src/frontend/package.json
          cp backend/app/main.py _src/backend_main.py
      - uses: actions/upload-artifact@v4
        with:
          name: v5500-extra-sources
          path: _src
          if-no-files-found: error
