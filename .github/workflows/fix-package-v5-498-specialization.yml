name: Fix and Package v5.498 Specialization

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-package-v5-498-specialization.yml

permissions:
  contents: write

jobs:
  fix-validate-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix specialization helper recursion
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('backend/app/services/agent_factory_workflow_design.py')
          text = path.read_text(encoding='utf-8')
          bad = 'def _enforce_specialized_agent_design(design: dict, request: str) -> dict:\n    design = _enforce_specialized_agent_design(design, request)\n    return enforce_media_agent_design(design, request)\n'
          good = 'def _enforce_specialized_agent_design(design: dict, request: str) -> dict:\n    design = enforce_blender_3d_agent_design(design, request)\n    return enforce_media_agent_design(design, request)\n'
          if text.count(bad) != 1:
              raise AssertionError('specialization recursion signature not found exactly once')
          path.write_text(text.replace(bad, good, 1), encoding='utf-8')
          print('v5.498 specialization recursion fix applied')
          PY

      - name: Validate Backend and execute specialization regression
        shell: bash
        run: |
          python -m compileall -q backend/app
          PYTHONPATH=backend python - <<'PY'
          from app.services.agent_factory_workflow_design import _enforce_specialized_agent_design
          from app.services.media_workflow_core import media_node_catalog, is_media_port_connection_allowed, normalize_workflow_media_extension

          media = _enforce_specialized_agent_design({}, 'ComfyUI로 상품 이미지를 생성하고 제품 원형을 검증하는 이미지 생성 Agent를 만들어줘')
          assert media['media_agent_plan']['type'] == 'MEDIA_CREATION'
          assert media['design_runtime']['agent_specialization'] == 'MEDIA_CREATION'
          media_steps = {row['name'] for row in media['target_agent_workflow']['steps']}
          for required in {'resolve_media_provider','submit_media_job','validate_media_result','human_media_approval','save_media_output'}:
              assert required in media_steps, required

          blender = _enforce_specialized_agent_design({}, 'Blender MCP를 사용해서 3D 모델을 만드는 Agent를 만들어줘')
          assert blender.get('three_d_agent_plan'), 'Blender specialization lost'

          general = _enforce_specialized_agent_design({'marker':'keep'}, '일반 텍스트 처리 Agent')
          assert general.get('marker') == 'keep'

          assert len(media_node_catalog()) >= 33
          assert is_media_port_connection_allowed('TEXT', 'PROMPT')
          assert not is_media_port_connection_allowed('VIDEO', 'IMAGE')
          legacy = {'steps':[{'name':'legacy'}]}
          normalized = normalize_workflow_media_extension(legacy)
          assert normalized['steps'] == legacy['steps']
          print('v5.498 specialization runtime regression PASS')
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend clean production build
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Commit regression fix
        shell: bash
        run: |
          git config user.name "ynystory-gif"
          git config user.email "ynystory@gmail.com"
          git add backend/app/services/agent_factory_workflow_design.py
          git commit -m "fix: preserve Blender and Media specialization routing in v5.498"
          git push origin HEAD:main

      - name: Build clean distribution tree
        shell: bash
        run: |
          rm -rf package
          mkdir package
          rsync -a ./ package/ \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'package' \
            --exclude 'frontend/node_modules' \
            --exclude 'frontend/dist' \
            --exclude 'README_V5_*.md'
          cp README_V5_498_MediaWorkflowCore.md package/
          find package -type d -name '__pycache__' -prune -exec rm -rf {} +
          find package -type f -name '*.pyc' -delete
          python - <<'PY'
          from pathlib import Path
          root = Path('package')
          factory = (root/'backend/app/services/agent_factory_workflow_design.py').read_text(encoding='utf-8')
          assert 'design = enforce_blender_3d_agent_design(design, request)' in factory
          assert 'design = _enforce_specialized_agent_design(design, request)\n    return enforce_media_agent_design' not in factory
          assert sorted(p.name for p in root.glob('README_V5_*.md')) == ['README_V5_498_MediaWorkflowCore.md']
          assert "AGENTSTUDIO_FRONTEND_VERSION='5.498'" in (root/'frontend/src/App.jsx').read_text(encoding='utf-8')
          assert 'version="5.498"' in (root/'backend/app/main.py').read_text(encoding='utf-8')
          assert (root/'backend/app/services/media_workflow_core.py').exists()
          assert (root/'backend/app/services/media_agent_design.py').exists()
          assert (root/'backend/app/api/media_workflow_routes.py').exists()
          assert not any(root.rglob('__pycache__'))
          assert not any(root.rglob('*.pyc'))
          assert not (root/'.github').exists()
          print('v5.498 corrected distribution PASS')
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: THEANOVA_AgentStudio_v5_498_MediaWorkflowCore_Corrected
          path: package
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
