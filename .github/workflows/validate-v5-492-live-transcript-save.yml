name: Validate v5.492 Live Transcript Save

on:
  push:
    branches: [fix/v5.492-live-transcript-text-save]

permissions:
  contents: write

jobs:
  build-test-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply v5.492 source changes
        run: python .github/scripts/apply_v5492_live_transcript_save.py

      - name: Validate backend and save contract
        shell: bash
        run: |
          python -m compileall -q backend/app
          python - <<'PY'
          from pathlib import Path
          app = Path('frontend/src/App.jsx').read_text(encoding='utf-8')
          memo = Path('frontend/src/components/memo/ProjectMemoPanel.tsx').read_text(encoding='utf-8')
          routes = Path('backend/app/api/routes.py').read_text(encoding='utf-8')
          main = Path('backend/app/main.py').read_text(encoding='utf-8')
          assert "AGENTSTUDIO_FRONTEND_VERSION='5.492'" in app
          assert 'version="5.492"' in main
          assert '"version": "5.492"' in routes
          assert '@router.post("/media-stt/save-text")' in routes
          assert 'await write_file(str(target), saved_text, force=True)' in routes
          assert 'Path("recordings")' in routes
          assert '💾 파일 저장' in memo
          assert '💾 요약 파일 저장' in memo
          assert 'project-live-save-path' in memo
          assert "'/media-stt/save-text'" in memo
          print('v5.492 contract PASS')
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend clean build
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Commit tested v5.492 source
        shell: bash
        run: |
          git config user.name "ynystory-gif"
          git config user.email "ynystory@gmail.com"
          git add -A
          git reset -- .github/workflows/validate-v5-492-live-transcript-save.yml .github/scripts/apply_v5492_live_transcript_save.py
          git commit -m "feat: save live transcript and summary text files for v5.492"
          git push origin HEAD:fix/v5.492-live-transcript-text-save

      - name: Build clean distribution tree
        shell: bash
        run: |
          rm -rf package
          mkdir package
          rsync -a ./ package/ --exclude '.git' --exclude '.github' --exclude 'package' --exclude 'frontend/node_modules' --exclude 'frontend/dist' --exclude 'README_V5_*.md'
          cp README_V5_492_LiveTranscriptTextFileSave.md package/
          python - <<'PY'
          from pathlib import Path
          root = Path('package')
          assert (root/'README.md').exists()
          latest = list(root.glob('README_V5_*.md'))
          assert [p.name for p in latest] == ['README_V5_492_LiveTranscriptTextFileSave.md']
          assert "AGENTSTUDIO_FRONTEND_VERSION='5.492'" in (root/'frontend/src/App.jsx').read_text(encoding='utf-8')
          assert 'version="5.492"' in (root/'backend/app/main.py').read_text(encoding='utf-8')
          assert '@router.post("/media-stt/save-text")' in (root/'backend/app/api/routes.py').read_text(encoding='utf-8')
          print('distribution contract PASS')
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: THEANOVA_AgentStudio_v5_492_LiveTranscriptTextFileSave
          path: package
          if-no-files-found: error
          retention-days: 90
