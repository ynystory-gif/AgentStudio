name: Apply v5.487 Image Preview Notebook Rich Result

on:
  push:
    paths:
      - '.github/workflows/apply-v5-487-image-preview-rich-result.yml'

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply v5.487 patch
        run: python .github/scripts/apply_v5_487_image_preview_rich_result.py

      - name: Remove one-shot patch helpers
        run: |
          rm -f .github/scripts/apply_v5_487_image_preview_rich_result.py
          rm -f .github/workflows/apply-v5-487-image-preview-rich-result.yml
          git diff --check

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend build
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Backend syntax validation
        run: |
          python -m compileall -q backend/app/api/routes.py backend/app/services/python_execution_service.py

      - name: Verify v5.487 markers
        run: |
          python - <<'PY'
          from pathlib import Path
          app = Path('frontend/src/App.jsx').read_text(encoding='utf-8')
          editor = Path('frontend/src/utils/editor.ts').read_text(encoding='utf-8')
          viewer = Path('frontend/src/components/viewers/DocumentViewers.tsx').read_text(encoding='utf-8')
          routes = Path('backend/app/api/routes.py').read_text(encoding='utf-8')
          worker = Path('backend/app/services/python_execution_service.py').read_text(encoding='utf-8')
          checks = {
              'frontend version': "AGENTSTUDIO_FRONTEND_VERSION='5.487'" in app,
              'image render branch': 'isImageFile(' in app and '<ImageViewer' in app,
              'binary image classification': 'isPresentationFile(filePath) || isImageFile(filePath)' in editor,
              'image viewer': 'export function ImageViewer' in viewer,
              'image endpoint': '@router.get("/files/image")' in routes,
              'image text guard': routes.count('IMAGE_BINARY_VIEWER_REQUIRED') >= 2,
              'notebook last expression rich result': '_agentstudio_notebook_mime_bundle(result)' in worker and '"output_type": "execute_result"' in worker,
          }
          failed = [name for name, ok in checks.items() if not ok]
          for name, ok in checks.items():
              print(('PASS' if ok else 'FAIL') + ' - ' + name)
          if failed:
              raise SystemExit('verification failed: ' + ', '.join(failed))
          PY

      - name: Commit tested v5.487
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: add image preview and notebook rich result for v5.487'
          git push origin HEAD:main
